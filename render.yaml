services:
  - type: web
    name: safia-dishes
    runtime: node
    branch: render-app
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run check && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safia-dishes-db
          property: connectionString
databases:
  - name: safia-dishes-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
